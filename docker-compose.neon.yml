version: '3.8'

services:
  # Backend Express.js avec Neon Database
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matcha-backend-neon
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}  # URL Neon depuis .env
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-for-development-only}
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matcha-frontend-neon
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules: